name: CI

on:
  push:
    paths-ignore: ['**/*.md', '.ai/**']
  pull_request:
    paths-ignore: ['**/*.md', '.ai/**']
  workflow_dispatch:

permissions:
  contents: read

# There is one runner: a newer push of the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, analyze, tests and web e2e
    # Always the self-hosted runner (Coolify, Linux x64), never GitHub-hosted runners.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      # The workspace stays on the runner between jobs: the incremental compilers start from their
      # last output in build/ and .dart_tool/ (faster unit test and e2e builds). Everything else
      # git does not track is removed.
      - name: Clean the workspace, keep the build caches
        run: git clean -ffdx -e /build/ -e /.dart_tool/

      # flutter-action needs these tools; a bare runner image may not have all of them.
      - name: Runner tools
        run: |
          packages=()
          for pair in curl:curl git:git jq:jq unzip:unzip xz:xz-utils zip:zip; do
            command -v "${pair%%:*}" >/dev/null || packages+=("${pair#*:}")
          done
          if (( ${#packages[@]} )); then
            sudo=$( (( EUID == 0 )) || echo sudo )
            $sudo apt-get update -q
            $sudo apt-get install -y -q --no-install-recommends "${packages[@]}"
          fi

      # No cache archives: the runner keeps its disk between jobs, so the SDK stays in its tool
      # cache and the pub cache in its home (restoring 1.7 GB of archives took a minute per run).
      # On a new runner container, flutter-action downloads the SDK once.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      # As root (the runner container), tar keeps the owner of the SDK archive: git then refuses the
      # SDK checkout ("dubious ownership"), and every flutter command fails.
      - name: Trust the Flutter SDK for git
        run: |
          git config --global --get-all safe.directory | grep -qxF "$FLUTTER_ROOT" ||
            git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool

      # setup-chrome keeps Chrome in the tool cache too; its apt-get step (Chrome's system
      # libraries) only runs when some are missing.
      - name: Chrome libraries
        id: chrome-libs
        run: |
          chrome="$RUNNER_TOOL_CACHE/setup-chrome/chrome/stable/x64/chrome"
          if [[ -x $chrome ]] && ! ldd "$chrome" | grep -q 'not found'; then
            echo install=false >>"$GITHUB_OUTPUT"
          else
            echo install=true >>"$GITHUB_OUTPUT"
          fi
      # Chrome and a matching chromedriver.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: ${{ steps.chrome-libs.outputs.install }}
          install-chromedriver: true

      # The e2e tests are the longest step (a debug build, then the app in Chrome): they run in the
      # background while the checks below run, and "End-to-end tests" waits for them and shows
      # their log. From here, flutter commands take --no-pub: dependencies are resolved once above,
      # commands running side by side must not resolve them again.
      - name: Start the end-to-end tests (Chrome)
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        # A container has a small /dev/shm: Chrome must not use it.
        run: |
          (
            start=$(date +%s) status=0
            scripts/e2e_web.sh --no-pub --web-browser-flag=--disable-dev-shm-usage || status=$?
            echo "End-to-end tests: exit code $status after $(($(date +%s) - start)) s"
            echo "$status" >"$RUNNER_TEMP/e2e.status"
          ) </dev/null >"$RUNNER_TEMP/e2e.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/e2e.pid"

      - run: flutter analyze --no-pub
      # Every test file in one process: one compile instead of one per file, which took most of
      # the time on this 4-CPU runner (the e2e build runs beside it).
      - name: Unit and widget tests
        run: scripts/test_bundle.sh --no-pub

      # Deals come from seeds: they must be the same on the VM, JavaScript and WebAssembly.
      # The e2e tests check deals in the JavaScript app; this checks the deal of every game in
      # WebAssembly (release builds), in one compile.
      - name: Deals are the same in WebAssembly
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: flutter test --no-pub --platform chrome --wasm test/cards/deals_on_web_test.dart

      - name: End-to-end tests (Chrome)
        run: |
          pid=$(<"$RUNNER_TEMP/e2e.pid")
          while [[ ! -f $RUNNER_TEMP/e2e.status ]] && kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/e2e.log"
          [[ -f $RUNNER_TEMP/e2e.status ]] || { echo 'The end-to-end tests stopped without a result.'; exit 1; }
          exit "$(<"$RUNNER_TEMP/e2e.status")"
