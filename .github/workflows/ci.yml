name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, analyze, unit and widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool
      - run: flutter analyze
      - run: flutter test
      # Deals come from seeds: they must be the same on the VM, JavaScript and WebAssembly.
      - name: Deals are the same on the web (JS and Wasm)
        run: |
          flutter test --platform chrome test/games/klondike/klondike_state_test.dart
          flutter test --platform chrome --wasm test/games/klondike/klondike_state_test.dart

  e2e:
    name: End-to-end tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      # The runner image ships Chrome and a matching chromedriver ($CHROMEWEBDRIVER).
      - run: scripts/e2e_web.sh
