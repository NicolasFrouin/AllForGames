name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# There is one runner: a newer push of the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, analyze, tests and web e2e
    # Always the self-hosted runner (Coolify, Linux x64), never GitHub-hosted runners.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # flutter-action needs these tools; a bare runner image may not have all of them.
      - name: Runner tools
        run: |
          packages=()
          for pair in curl:curl git:git jq:jq unzip:unzip xz:xz-utils zip:zip; do
            command -v "${pair%%:*}" >/dev/null || packages+=("${pair#*:}")
          done
          if (( ${#packages[@]} )); then
            sudo=$( (( EUID == 0 )) || echo sudo )
            $sudo apt-get update -q
            $sudo apt-get install -y -q --no-install-recommends "${packages[@]}"
          fi

      # No cache archives: the runner keeps its disk between jobs, so the SDK stays in its tool
      # cache and the pub cache in its home (restoring 1.7 GB of archives took a minute per run).
      # On a new runner container, flutter-action downloads the SDK once.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      # As root (the runner container), tar keeps the owner of the SDK archive: git then refuses the
      # SDK checkout ("dubious ownership"), and every flutter command fails.
      - name: Trust the Flutter SDK for git
        run: |
          git config --global --get-all safe.directory | grep -qxF "$FLUTTER_ROOT" ||
            git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool
      - run: flutter analyze
      - run: flutter test

      # setup-chrome keeps Chrome in the tool cache too; its apt-get step (Chrome's system
      # libraries) only runs when some are missing.
      - name: Chrome libraries
        id: chrome-libs
        run: |
          chrome="$RUNNER_TOOL_CACHE/setup-chrome/chrome/stable/x64/chrome"
          if [[ -x $chrome ]] && ! ldd "$chrome" | grep -q 'not found'; then
            echo install=false >>"$GITHUB_OUTPUT"
          else
            echo install=true >>"$GITHUB_OUTPUT"
          fi
      # Chrome and a matching chromedriver.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: ${{ steps.chrome-libs.outputs.install }}
          install-chromedriver: true

      # Deals come from seeds: they must be the same on the VM, JavaScript and WebAssembly.
      - name: Deals are the same on the web (JS and Wasm)
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          flutter test --platform chrome test/games/klondike/klondike_state_test.dart
          flutter test --platform chrome --wasm test/games/klondike/klondike_state_test.dart

      - name: End-to-end tests (Chrome)
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        # A container has a small /dev/shm: Chrome must not use it.
        run: scripts/e2e_web.sh --web-browser-flag=--disable-dev-shm-usage
