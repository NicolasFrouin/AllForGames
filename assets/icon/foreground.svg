<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <!-- Android adaptive icon foreground: 108 dp canvas, the art stays inside the 66 dp safe circle (with a margin). -->
  <g transform="translate(54 54) scale(0.9) translate(-54 -54)">
    <!-- art -->
    <g id="art">
      <defs>
        <linearGradient id="tile-face" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFDF4"/>
          <stop offset="1" stop-color="#F0E6CC"/>
        </linearGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>
      </defs>
      <g transform="translate(43 45.5) rotate(-14)">
        <rect x="-11" y="-13" width="24" height="32" rx="4" fill="#000" opacity="0.3" filter="url(#soft-shadow)"/>
        <rect x="-10.5" y="-13" width="24" height="32" rx="4" fill="#BFAE84"/>
        <rect x="-12" y="-16" width="24" height="32" rx="4" fill="url(#tile-face)"/>
        <circle cx="0" cy="0" r="6.4" fill="none" stroke="#23803A" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="4" fill="#C62828"/>
      </g>
      <g transform="translate(61 57.5) rotate(12)">
        <rect x="-14" y="-19" width="30" height="42" rx="4" fill="#000" opacity="0.35" filter="url(#soft-shadow)"/>
        <rect x="-15" y="-21" width="30" height="42" rx="4" fill="#FFFFFF"/>
        <path transform="translate(-9.5 -9.5) scale(19)" fill="#C62828"
          d="M0.5 0.95C0.15 0.7 0 0.5 0 0.3C0 0.12 0.13 0.04 0.27 0.04C0.38 0.04 0.46 0.12 0.5 0.22C0.54 0.12 0.62 0.04 0.73 0.04C0.87 0.04 1 0.12 1 0.3C1 0.5 0.85 0.7 0.5 0.95Z"/>
      </g>
    </g>
    <!-- /art -->
  </g>
</svg>
