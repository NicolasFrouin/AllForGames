<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Classic games: solitaires, Mahjong and more">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="All For Games">
  <!-- Full bleed: iOS rounds the corners itself and would show transparent ones in black. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>All For Games</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E3B2C">
  <!-- The color of the page until the app draws (no white flash). -->
  <style>html, body { background: #0A1F1A; }</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // sw.js keeps the app for offline play (an iPhone home screen app too).
    // Not on localhost: `flutter run` and the e2e tests load fresh files.
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { scope: './' }).then((registration) => {
        // A new version takes over once the app is hidden: the games save
        // themselves then, so the reload loses nothing.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && registration.waiting) {
            registration.waiting.postMessage('skipWaiting');
          } else if (document.visibilityState === 'visible') {
            registration.update();
          }
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) location.reload();
      });
      // A home screen app keeps its statistics: ask the browser to never
      // clear them.
      if (matchMedia('(display-mode: standalone)').matches && navigator.storage?.persist) {
        navigator.storage.persist();
      }
    }
  </script>
</body>
</html>
